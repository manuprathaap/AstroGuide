<header class="astro-header">
  <div class="astro-container nav-container">
    <!-- Left: AstroGuide Brand & Tagline -->
    <div class="header-left">
      <a routerLink="/" class="brand-logo" aria-label="AstroGuide Home">
        <span class="logo-mark" aria-hidden="true">✦</span>
        <span class="brand-text">Astro<span class="brand-accent">Guide</span></span>
      </a>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-tagline">Personal Vedic Astrology &amp; Guidance</span>
    </div>

    <!-- Right: Language Selector & Compact Controls -->
    <div class="header-right">
      <!-- Language Selector -->
      <a 
        routerLink="/language" 
        [queryParams]="{ returnUrl: currentUrl() }" 
        class="lang-pill" 
        title="Change Language"
        id="header-lang-selector"
      >
        <span class="globe-icon" aria-hidden="true">🌐</span>
        <span class="lang-text">{{ currentLanguageLabel() }}</span>
        <svg class="chevron-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </a>

      @if (isAuthenticated()) {
        <!-- User Chip -->
        <div class="user-chip" [title]="currentUser()?.email || ''">
          <div class="user-avatar" aria-hidden="true">
            {{ currentUser()?.full_name ? (currentUser()?.full_name?.charAt(0) | uppercase) : 'U' }}
          </div>
          <span class="user-name">{{ currentUser()?.full_name || 'Seeker' }}</span>
        </div>

        <!-- Sign Out Button -->
        <button 
          type="button" 
          id="header-logout-btn"
          class="btn-text-action" 
          (click)="logout()"
          [attr.aria-label]="t().nav.signOut"
        >
          {{ t().nav.signOut }}
        </button>
      } @else {
        <a routerLink="/auth/login" class="btn-text-action">{{ t().nav.signIn }}</a>
        <a routerLink="/auth/register" class="btn-primary-compact">{{ t().nav.getStarted }}</a>
      }
    </div>
  </div>
</header>
